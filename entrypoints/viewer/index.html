<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1117;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 16px;
        background: #161b22;
        color: #e6edf3;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        border-bottom: 1px solid #30363d;
      }
      #type {
        color: #8b949e;
        font-size: 12px;
        text-transform: uppercase;
      }
      #download {
        background: #238636;
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 6px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      #download:hover {
        background: #2ea043;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
        padding: 16px;
      }
      img,
      video {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      #error {
        color: #f85149;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <header>
      <span id="type"></span>
      <button id="download">Download</button>
    </header>
    <main id="content"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
